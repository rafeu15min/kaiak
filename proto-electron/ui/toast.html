<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font: 13px var(--font, system-ui, sans-serif); color: var(--fg, #d8dae0); }
  #pill { box-sizing: border-box; height: 100%; padding: 9px 14px; border-radius: 10px; background: var(--bg, #1e1f24);
          border: 1px solid var(--border, #2b2d34); box-shadow: inset 3px 0 0 var(--accent, #7aa2f7), 0 6px 18px rgba(0, 0, 0, .45); }
  #title { font-weight: 600; }
  #text { margin-top: 2px; color: var(--muted, #8a8d98); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
<div id="pill"><div id="title"></div><div id="text"></div></div>
<script src="theme.js"></script>
<script src="toast.js"></script>
